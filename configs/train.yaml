# Обучение YOLOv8n и прогон всего конвейера (src/run_experiment.py).
# Режимы и параметры масок обучения — configs/masks.yaml (раздел training); протокол оценки — configs/protocol.yaml.

# Начальные веса: YOLOv8n, предобученная на COCO (80 классов; голова заменяется на 1 класс Cyclist).
# Источник: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt (скачано 17.11.2026),
# SHA-256 f59b3d833e2ff32e194b5bb8e08d211dc7c5bdf144b90d2c8412c47ccfc83b36. weights/ — в .gitignore.
# Обучение с нуля — model: yolov8n.yaml.
model: weights/yolov8n.pt

imgsz: 640
batch: 16
epochs: 100            # основная серия; для smoke test — см. smoke.epochs
# Маски обучения зависят только от (seed, изображение, эпоха) — src/occlusion_train.py, EpochSampler.
# Проверено 17.11.2026: два запуска с workers 8 и mosaic дали одинаковые журналы масок (reports/workers_check.md);
# одна эпоха KITTI train: 101 с при workers 0, 54 с при workers 8.
workers: 8
deterministic: true
amp: true
plots: false
# Модель — веса последней эпохи; выбор «лучшей» эпохи не делается, поэтому валидация Ultralytics
# по эпохам отключена (calib используется только для замороженного порога, см. protocol.yaml).
val: false
offline: true          # YOLO_OFFLINE=1: Ultralytics ничего не скачивает

# baseline, ORE и схема 2×2 по заливке и приманкам (configs/masks.yaml, training): 6 режимов × 3 seed × 2 датасета.
regimes: [baseline, proposed, bg_nodecoy, noise_decoy, proposed_noise, ore]
seeds: [1, 2, 3]
datasets: [kitti, bdd]

inference:
  batch: 32
  max_det_raw: 300     # сколько рамок оставляет Ultralytics; окончательный NMS и max_det — по протоколу

out_dir: runs

# Технический прогон (замечание 8): малое подмножество, несколько эпох. Числа — не результат исследования.
# Оценка в техническом прогоне — ТОЛЬКО на calib (замечание 5, fix_plan2): test в проверочных прогонах
# не используется, его изображения в подмножество технического прогона не входят.
smoke:
  limit: 200           # изображений в train и calib (сначала с целями, затем без, по алфавиту)
  epochs: 3
