# Протокол оценки (замечание 7). Фиксируется ДО обучения; менять после получения результатов нельзя.

# --- Постобработка детекций ---------------------------------------------------------
# Один и тот же NMS применяется к выходу любой модели (baseline, proposed, ORE) кодом src/evaluate.py,
# поэтому результат не зависит от версии и настроек NMS внутри Ultralytics.
nms:
  iou: 0.6          # подавлять рамку, если IoU с более уверенной рамкой > iou
  conf: 0.001       # детекции с confidence ниже — отбрасываются до NMS (нужна полная кривая Recall–FPPI)
  max_det: 100      # не более max_det рамок на изображение после NMS (по убыванию confidence)

# --- Сопоставление детекций с разметкой ------------------------------------------------
matching:
  iou: 0.5          # TP, если IoU с целевой рамкой >= iou
  # Порядок: детекции изображения по убыванию confidence (при равенстве — по порядку в файле).
  # Для каждой детекции:
  #   1) свободная целевая рамка с наибольшим IoU >= iou  -> TP, рамка занята;
  #   2) иначе, если IoU >= iou только с уже занятой целевой рамкой -> дубль (см. duplicates);
  #   3) иначе, если доля площади детекции внутри ignore-области >= ignore_ioa -> игнорируется
  #      (не TP и не FP; одна ignore-область может «поглотить» любое число детекций);
  #   4) иначе -> FP.
  duplicates: fp    # дубль уже найденной цели считается ложным срабатыванием
  ignore_ioa: 0.5
  # Цели, не входящие в оцениваемое подмножество (например, occluded=true при оценке
  # подмножества not_occluded), переводятся в ignore — их обнаружение не штрафуется и не засчитывается.
  # Цель, чью рамку маски СОСЕДНИХ объектов закрывают сильнее neighbor_mask_max_cover, на этом уровне
  # переводится в ignore: её фактическое перекрытие не равно номинальному уровню.
  neighbor_mask_max_cover: 0.10

# --- Метрики -------------------------------------------------------------------------------
metrics:
  target_fppi: 0.1
  # Порог confidence модели подбирается на calib на уровне маски calib_level: наименьший порог,
  # при котором FPPI на calib <= target_fppi. Этот порог заморожен и применяется к test на всех уровнях.
  calib_level: 0.0
  # FPPI = число FP / число ВСЕХ изображений части (включая изображения без целей).
  # AP@0.5: площадь под огибающей кривой precision–recall (all-point interpolation, VOC 2010+).
  ap_interpolation: all_points

# --- Правило при разном фактическом FPPI -------------------------------------------------------
# Основная метрика — Recall на test при замороженном пороге. Если фактический FPPI двух сравниваемых
# моделей на test различается больше чем на fppi_tolerance, преимущество по Recall засчитывается,
# только если оно сохраняется и при равном бюджете ложных срабатываний: Recall обеих моделей
# пересчитывается по кривой Recall–FPPI на test при FPPI = max(FPPI_A, FPPI_B) (обеим даётся больший
# из двух бюджетов). Если знак разности при этом меняется — результат «не установлен».
# Пороги по test при этом не перенастраиваются: пересчёт — только проверка, не новая точка работы.
fppi_rule:
  fppi_tolerance: 0.05
  matched_budget: max

# --- Статистическая процедура (замечание 6) -----------------------------------------------------
# Описание и обоснование — text/stats.md. Реализация — src/stats.py.
stats:
  datasets: [kitti, bdd]
  seeds: [1, 2, 3]              # одни и те же seed для всех режимов -> пары (proposed_s, baseline_s)
  treatment: proposed
  control: baseline
  secondary: [ore]              # сравнения proposed с ними — вторичные, в правило решения не входят
  subset: all                   # основная оцениваемая совокупность; not_occluded для BDD — отдельный отчёт
  # Двухступенчатый парный бутстрэп. В каждой реплике:
  #   1) с возвращением выбираются 3 индекса seed (общие для proposed и baseline — пары сохраняются);
  #   2) с возвращением выбираются кластеры test (BDD — префикс имени, KITTI — поездка), столько же,
  #      сколько их в test; изображения кластера входят вместе со своими масками на всех уровнях;
  #   3) для каждой модели на выбранных кластерах пересчитываются Recall и FPPI при её замороженном
  #      пороге и AP@0.5; пороги и маски НЕ пересчитываются (условно на calib и на сгенерированные маски);
  #   4) Δ = среднее по выбранным seed разностей (proposed_s − baseline_s).
  bootstrap:
    replicas: 10000
    seed: 5501
    chunk: 100                  # реплик за один проход (только память, на результат не влияет)
    resample_seeds: true
  interval: percentile          # процентильный интервал бутстрэпа
  alpha: 0.05
  # 8 проверок Recall: 4 уровня x 2 датасета. Поправка Бонферрони: двусторонний интервал 1 − alpha/8.
  recall_levels: [0.3, 0.5, 0.7, 0.9]
  bonferroni_m: 8
  # 2 обязательных условия mAP (по одному на датасет): не хуже baseline больше чем на margin
  # на уровне 0 %. Проверка: нижняя граница одностороннего интервала (1 − alpha) для ΔAP > −margin.
  # Условия объединяются логическим «И» (intersection–union), поправка не нужна.
  map:
    level: 0.0
    margin: 0.02

# --- Контроль обучения на заплатку (добавлено после технического прогона, до основной серии) ----------
# На test к каждой цели строится заплатка размера её маски уровня masks.control.level, поставленная на фон
# вне всех рамок (splits/control_*_test.csv); цели не закрыты. Доля заплаток с детекцией (IoU >= matching.iou
# или >= ignore_ioa площади детекции внутри заплатки) при замороженном пороге считается для каждой модели.
# Если средняя по seed доля у treatment превышает долю у control больше чем на max_hit_gap, вывод
# «режим полезен» не делается ни для одного уровня этого датасета (возможное обучение на заплатку).
control:
  max_hit_gap: 0.05
